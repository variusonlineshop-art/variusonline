<!doctype html>
<html lang="es" class="h-full bg-slate-50">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin — redirigiendo...</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#2b6ef6',
                    },
                    boxShadow: {
                        'custom-card': '0 8px 30px rgba(11, 15, 34, 0.06)',
                        'custom-inner': 'inset 0 -6px 20px rgba(0, 0, 0, 0.06)',
                    }
                }
            }
        }
    </script>
</head>

<body class="h-full text-slate-900 antialiased bg-gradient-to-b from-slate-50 to-white font-sans">

    <div class="min-h-screen flex items-center justify-center p-6" role="main">
        <div class="w-full max-w-[520px] bg-white rounded-xl p-7 shadow-custom-card flex flex-col sm:flex-row gap-5 items-start sm:items-center justify-between transition-all"
            aria-live="polite" aria-busy="true">

            <div class="flex gap-3.5 items-center flex-1 min-w-0 w-full" title="Varius — Admin">
                <div class="w-14 h-14 flex-shrink-0 rounded-xl bg-gradient-to-br from-[#3b3b3b] to-[#131313] flex items-center justify-center text-white font-bold shadow-custom-inner overflow-hidden"
                    aria-hidden="true">
                    <img src="assets/img/logo.png" alt="Varius" class="w-full object-cover">
                </div>
                <div class="min-w-0">
                    <h1 class="text-lg font-bold m-0 leading-none text-slate-900 truncate">Varius — Panel</h1>
                    <div class="mt-1 text-gray-500 text-xs truncate">Verificando usuario y redirigiendo…</div>
                </div>
            </div>

            <div class="flex gap-3.5 items-center flex-shrink-0 w-full sm:w-auto justify-between sm:justify-start"
                aria-hidden="false">
                <div class="w-[42px] h-[42px] rounded-full border-4 border-slate-900/5 border-top-color border-t-accent animate-spin flex-shrink-0"
                    aria-hidden="true"></div>
                <div class="flex flex-col gap-1 items-end sm:items-start text-right sm:text-left">
                    <div id="statusMain" class="text-sm font-semibold text-slate-900">Cargando</div>
                    <div id="statusSub" class="text-xs text-gray-500">Aguarda unos segundos...</div>
                </div>
            </div>

        </div>
    </div>

    <div class="fixed bottom-4 left-0 right-0 px-4 text-center text-xs text-gray-500">
        Si la redirección tarda más de 10 segundos, revisa tu conexión o inicia sesión de nuevo.
    </div>

    <script type="module">
        import { firebaseConfig } from '../assets/js/firebase-config.js';
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

        const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const STATUS_MAIN = document.getElementById('statusMain');
        const STATUS_SUB = document.getElementById('statusSub');

        const ROLE_ROUTES = {
            vendedor: 'vendedor.html',
            motorizado: 'motorizado.html',
            administrador: 'administrador.html',
            gerente: 'gerente.html'
        };

        function setStatus(main, sub) {
            if (main) STATUS_MAIN.textContent = main;
            if (sub) STATUS_SUB.textContent = sub;
        }

        // Si ya conocemos el rol localmente, podemos acelerar la interfaz mentalmente
        const cachedRole = localStorage.getItem('_user_role');

        const fallbackTimer = setTimeout(() => {
            setStatus('Tiempo de espera', 'No se pudo verificar a tiempo. Intenta recargar.');
        }, 12000);

        // Guardamos la referencia de la función para poder apagarla
        const unsubscribe = onAuthStateChanged(auth, async (user) => {
            // Apagamos el listener inmediatamente al recibir el estado inicial
            unsubscribe();
            clearTimeout(fallbackTimer);

            if (!user) {
                localStorage.removeItem('_user_role'); // Limpiamos caché si cerró sesión
                setStatus('No autenticado', 'Redirigiendo al inicio de sesión...');
                setTimeout(() => { window.location.href = '/login.html'; }, 900); // <-- Ojo con la ruta origen
                return;
            }

            // Si tenemos el rol en caché, procesamos la ruta ultra rápido
            if (cachedRole && ROLE_ROUTES[cachedRole]) {
                setStatus('Redirigiendo', `Entrando como ${cachedRole}...`);
                setTimeout(() => { window.location.href = ROLE_ROUTES[cachedRole]; }, 400);
                return;
            }

            setStatus('Autenticado', 'Comprobando permisos...');

            try {
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                const role = userDoc.exists() ? (userDoc.data().role || 'vendedor') : 'vendedor';

                // Guardamos en caché para la próxima visita
                localStorage.setItem('_user_role', role);

                setStatus('Redirigiendo', `Entrando como ${role}...`);
                setTimeout(() => {
                    window.location.href = ROLE_ROUTES[role] || ROLE_ROUTES['vendedor'];
                }, 700);

            } catch (err) {
                console.error('Error verificando rol:', err);
                setStatus('Error', 'No se pudo comprobar el rol.');
                setTimeout(() => { window.location.href = '/login.html'; }, 2000);
            }
        });
    </script>
</body>

</html>
