<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chat de Clientes — Varius</title>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/presence.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            overflow: hidden;
            height: 100vh;
        }

        .main {
            height: calc(100vh - 64px);
            overflow: hidden;
            box-sizing: border-box;
            padding: 0 !important;
        }

        /* Indicador de escritura animado */
        @keyframes blink {

            0%,
            100% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }
        }

        .animate-blink {
            animation: blink 1s infinite;
        }
    </style>
</head>

<body>
    <input id="nav-toggle" type="checkbox" class="nav-toggle" aria-hidden="true">

    <!-- Top bar -->
    <header class="topbar">
        <div class="top-left">
            <label for="nav-toggle" class="hamburger" aria-hidden="true">
                <span class="hamburger-box"><span class="hamburger-inner"></span></span>
            </label>
            <a class="brand" href="./" aria-label="Dashboard">
                <img src="assets/img/logo.png" alt="Varius" width="14%">
                <span class="brand-text">VARIUS</span>
            </a>
        </div>

        <div class="top-search">
            <div id="presence-pill" class="presence-pill online" role="status" aria-live="polite">
                <span class="dot"></span>
                <span class="label">Conectado</span>
            </div>
        </div>
    </header>

    <div id="app-sidebar"></div>

    <!-- Main content -->
    <main class="main">
        <!-- Se removió el comportamiento de ocultar el aside en desktop -->
        <div id="chat-layout" class="flex h-full w-full overflow-hidden bg-white">

            <!-- Panel Izquierdo: Fijo en desktop, toggle en móvil -->
            <aside id="chat-list"
                class="w-full md:w-80 lg:w-96 border-r border-gray-100 flex flex-col shrink-0 h-full transition-all duration-300 bg-white">
                <div class="p-4 border-b border-gray-100 bg-gray-50/50">
                    <div class="flex items-center gap-3 mb-3">
                        <div
                            class="w-9 h-9 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-md shadow-blue-100">
                            <i class="fa-solid fa-comments"></i>
                        </div>
                        <div>
                            <h2 class="text-base font-bold text-gray-800 leading-tight">Chats</h2>
                            <p class="text-xs text-gray-400">Atiende a tus clientes</p>
                        </div>
                    </div>
                    <div class="relative group">
                        <i
                            class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 group-focus-within:text-blue-500 transition-colors"></i>
                        <input id="contact-search" type="text" placeholder="Buscar conversación..."
                            class="w-full pl-11 pr-4 py-2.5 bg-gray-50 border border-transparent rounded-2xl focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none text-xs transition-all">
                    </div>
                </div>

                <div id="contact-list" class="flex-1 overflow-y-auto divide-y divide-gray-50">
                    <!-- Dinámico por JS -->
                </div>
            </aside>

            <!-- Panel Derecho: Siempre visible en desktop (flex), adaptable solo en móviles pequeños si se requiere -->
            <section id="chat-panel" class="flex-1 flex flex-col bg-slate-50/60 h-full relative overflow-hidden">
                <!-- Header del Chat -->
                <header id="chat-header"
                    class="h-16 bg-white border-b border-gray-100 px-6 flex items-center justify-between shrink-0 shadow-xs z-10">
                    <!-- Dinámico por JS -->
                </header>

                <!-- Mensajes -->
                <div id="messages-container"
                    class="flex-1 overflow-y-auto p-6 space-y-4 bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:16px_16px]">
                    <!-- Dinámico por JS -->
                </div>

                <!-- Emoji Picker -->
                <div id="emoji-picker"
                    class="hidden absolute bottom-20 left-6 z-30 w-80 bg-white border border-gray-100 rounded-3xl shadow-2xl overflow-hidden p-2">
                    <div id="emoji-categories"
                        class="flex gap-1 p-2 bg-gray-50 rounded-2xl overflow-x-auto text-xs mb-2"></div>
                    <div id="emoji-grid" class="p-2 grid grid-cols-7 gap-1 max-h-48 overflow-y-auto text-lg"></div>
                </div>

                <!-- Añadir justo antes del footer de entrada de chat en chats.html -->
                <div id="reply-preview-container"
                    class="hidden px-4 pt-3 pb-1 bg-white border-t border-gray-100 flex items-center justify-between">
                    <div id="reply-preview-content"
                        class="flex-1 border-l-4 border-blue-600 pl-3 py-1 bg-blue-50/50 rounded-r-xl text-xs">
                        <!-- Contenido dinámico de la cita -->
                    </div>
                    <button id="cancel-reply-btn" type="button" class="text-gray-400 hover:text-gray-600 p-2">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>

                <!-- Entrada de mensaje -->
                <footer class="p-4 bg-white border-t border-gray-100">
                    <div
                        class="max-w-4xl mx-auto flex items-center gap-2 bg-gray-50 p-2 rounded-2xl border border-gray-200 focus-within:bg-white focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-500/10 transition-all">
                        <button id="emoji-btn" type="button"
                            class="w-10 h-10 rounded-xl bg-white text-gray-400 hover:text-gray-600 flex items-center justify-center border border-gray-100 shadow-sm transition-all">
                            <i class="fa-regular fa-face-smile text-lg"></i>
                        </button>
                        <input id="chat-input" type="text" placeholder="Escribe un mensaje..."
                            class="flex-1 bg-transparent px-2 text-xs font-medium text-gray-800 focus:outline-none placeholder:text-gray-400">
                        <button id="send-btn" type="button"
                            class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-95 transition-all">
                            <i class="fa-solid fa-paper-plane text-xs"></i>
                        </button>
                    </div>
                </footer>
            </section>

        </div>
    </main>

    <script type="module" src="../assets/js/chats.js"></script>
    <script type="module" src="../assets/js/sidebar-loader.js"></script>
    <script type="module" src="../assets/js/session-timeout.js"></script>
</body>

</html>
