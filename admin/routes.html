<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Panel — Varius</title>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/app.css">
    <link rel="stylesheet" href="../assets/css/presence.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAZw9mb2oBWaK2UjRCHNT5fS-irOCUIq_Q&libraries=geometry,places"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        #delivery-map {
            width: 100%;
            height: 100%;
            /* Esto obliga al mapa a llenar el cuadro blanco */
            min-height: 400px;
            /* Añade esto para asegurar visibilidad */
            border-radius: 12px;
        }

        .sidebar {
            z-index: 10 !important;
        }
    </style>
</head>

<body>
    <input id="nav-toggle" type="checkbox" class="nav-toggle" aria-hidden="true">
    <!-- Top bar -->
    <header class="topbar">
        <div class="top-left">
            <label for="nav-toggle" class="hamburger" aria-hidden="true">
                <span class="hamburger-box"><span class="hamburger-inner"></span></span>
            </label>
            <a class="brand" href="./" aria-label="Dashboard">
                <img src="assets/img/logo.png" alt="Varius" width="14%">
                <span class="brand-text">VARIUS</span>
            </a>
        </div>

        <div class="top-search">
            <!-- input eliminado intencionalmente -->
            <div id="presence-pill" class="presence-pill offline" role="status" aria-live="polite">
                <span class="dot"></span>
                <span class="label">Desconectado</span>
            </div>
        </div>
    </header>

    <div id="app-sidebar"></div>

    <!-- Main content -->
    <main class="main p-2 md:p-4">
        <div class="flex flex-col lg:flex-row gap-4 h-[calc(100vh-120px)]">

            <div
                class="w-full lg:w-1/3 bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col overflow-hidden">
                <div class="p-4 border-b border-gray-100 bg-gray-50/50">
                    <h2 class="text-sm font-bold text-gray-800 uppercase tracking-wider mb-3">Rutas de Entrega</h2>

                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                            <i class="fa-solid fa-magnifying-glass text-gray-400 text-xs"></i>
                        </span>
                        <input type="text" id="customer-search"
                            class="block w-full pl-10 pr-3 py-2 border border-gray-200 rounded-xl text-xs focus:ring-blue-500 focus:border-blue-500 bg-white"
                            placeholder="Buscar por nombre o teléfono...">
                    </div>
                </div>

                <div id="customer-list" class="flex-1 overflow-y-auto p-2 space-y-2 custom-scrollbar">
                </div>

                <!-- Paginación -->
                <div id="pagination-container"
                    class="p-3 border-t border-gray-100 bg-gray-50/50 flex justify-center items-center gap-1 text-xs select-none">
                </div>
            </div>

            <div
                class="w-full lg:w-2/3 h-[400px] lg:h-full bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden relative">
                <div id="delivery-map" class="h-full w-full z-0"></div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script type="module" src="../assets/js/delivery-routes.js"></script>
    <script type="module" src="../assets/js/sidebar-loader.js"></script>
    <script type="module" src="../assets/js/session-timeout.js"></script>

</body>

</html>
