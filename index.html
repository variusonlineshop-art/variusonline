  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <style>
    /* Reset y variables */
    :root {
      --bg-color: #FFFFFF;
      --spinner-color: #333333;
      --transition-speed: 0.3s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .preloader-wrapper {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity var(--transition-speed) ease-out;
    }

    /* Indicador de carga (Spinner) */
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-left-color: var(--spinner-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* Clase para desvanecimiento al salir */
    .fade-out {
      opacity: 0;
    }
  </style>


</head>

<body>

  <main class="preloader-wrapper" id="app">
    <div class="spinner"></div>
  </main>

  <script>
    /**
     * CONFIGURACIÓN
     */
    const CONFIG = {
      REDIRECT_URL: "catalogo.html",
      PRELOADER_TIME: 1500 // Tiempo de espera antes de redirigir en milisegundos (1.5 segundos)
    };

    /**
     * Lógica de Redirección
     */
    function redirectToNextPage() {
      document.getElementById('app').classList.add('fade-out');
      setTimeout(() => {
        window.location.href = CONFIG.REDIRECT_URL;
      }, 300); // Pequeño delay para la transición de suavizado
    }

    // Timer para redirigir tras mostrar el preloader
    setTimeout(redirectToNextPage, CONFIG.PRELOADER_TIME);
  </script>
</body>

</html>
