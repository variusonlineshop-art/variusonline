  <style>
    /* Reset y variables para fácil mantenimiento */
    :root {
      --bg-color: #FFFFFF;
      --transition-speed: 0.5s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .splash-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .splash-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Asegura que el video llene la pantalla sin deformarse */
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      /* Atajo para top, left, bottom, right: 0 */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      /* Permite clicks a través del overlay */
    }

    /* Clase para desvanecimiento al salir (opcional) */
    .fade-out {
      opacity: 0;
      transition: opacity var(--transition-speed) ease-out;
    }
  </style>

<body>

  <main class="splash-wrapper" id="app">
    <video id="splash-video" muted autoplay playsinline preload="auto" class="splash-video">
      <source id="video-source" src="" type="video/mp4">
      Bienvenidos a Varius Online
    </video>

    <div class="overlay">
    </div>
  </main>

  <script>
    /**
     * CONFIGURACIÓN
     */
    const CONFIG = {
      REDIRECT_URL: "catalogo.html",
      MAX_WAIT_TIME: 2000, // 5 segundos máximo
      MOBILE_BREAKPOINT: 768,
      VIDEOS: {
        DESKTOP: "assets/video/animacion-bienvenida.mp4",
        MOBILE: "assets/video/animacion-bienvenida.mp4" // 🔁 Cambia esto
      }
    };

    const videoElement = document.getElementById("splash-video");
    const sourceElement = document.getElementById("video-source");

    /**
     * Lógica para seleccionar el video según el ancho de pantalla
     */
    function setupVideoSource() {
      const isMobile = window.innerWidth <= CONFIG.MOBILE_BREAKPOINT;
      const selectedVideo = isMobile ? CONFIG.VIDEOS.MOBILE : CONFIG.VIDEOS.DESKTOP;

      sourceElement.setAttribute("src", selectedVideo);
      videoElement.load(); // Recarga el video con la nueva fuente
    }

    /**
     * Lógica de Redirección
     */
    function redirectToNextPage() {
      document.getElementById('app').classList.add('fade-out');
      setTimeout(() => {
        window.location.href = CONFIG.REDIRECT_URL;
      }, 300); // Pequeño delay para la transición visual
    }

    // Inicializar video
    setupVideoSource();

    // Evento: El video termina de reproducirse
    videoElement.onended = redirectToNextPage;

    // Evento: Timer de seguridad (por si el video tarda en cargar o falla)
    setTimeout(() => {
      if (!videoElement.ended) {
        redirectToNextPage();
      }
    }, CONFIG.MAX_WAIT_TIME);

    // Opcional: Manejar cambio de tamaño de pantalla en tiempo real
    // (Nota: Esto reiniciaría el video si el usuario rota el celular)
    /*
    window.addEventListener('resize', () => {
       // lógica de cambio si es estrictamente necesario
    });
    */
  </script>
</body>
