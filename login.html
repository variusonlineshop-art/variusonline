<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Iniciar sesión | Varius Online</title>
    <script>
        window.tailwind = {
            config: {
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="assets/img/favicon.png">

    <style>
        @keyframes gradient-move {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .animated-bg {
            background: linear-gradient(-45deg, #f8fafc, #e2e8f0, #d1d5db, #90d9d0);
            background-size: 400% 400%;
            animation: gradient-move 15s ease infinite;
            position: relative;
            overflow: hidden;
        }

        .animated-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(#90d9d0 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            opacity: 0.2;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body class="animated-bg min-h-screen flex items-center justify-center p-4">
    <main class="w-full max-w-md">
        <section class="glass-card shadow-2xl rounded-2xl p-8 transition-all duration-300 hover:shadow-primary/20">
            <img src="admin/assets/img/logo.png" alt="Logo" class="block mx-auto mb-6 w-24 h-auto drop-shadow-sm" />

            <h1 class="text-2xl font-bold text-gray-800 text-center mb-8">¡Bienvenido de nuevo!</h1>

            <form id="login-form" class="space-y-5" novalidate>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1.5" for="login-email">Correo
                        electrónico</label>
                    <input id="login-email"
                        class="w-full h-11 px-4 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-[#90d9d0] focus:border-transparent transition-all"
                        type="email" placeholder="ejemplo@correo.com" required>
                    <div id="login-email-alert" class="text-xs text-red-500 mt-1 min-h-[1.25rem]"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1.5"
                        for="login-password">Contraseña</label>
                    <div class="relative">
                        <input id="login-password"
                            class="w-full h-11 px-4 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-[#90d9d0] focus:border-transparent transition-all"
                            type="password" placeholder="••••••••" required>
                        <button id="login-toggle-password" type="button"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
                            👁️
                        </button>
                    </div>
                    <div id="login-password-alert" class="text-xs text-red-500 mt-1 min-h-[1.25rem]"></div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="w-full bg-[#90d9d0] hover:bg-[#7bc4bc] text-[#2c4744] font-bold py-3 rounded-xl shadow-lg shadow-[#90d9d0]/30 transform transition-all active:scale-[0.98] hover:-translate-y-0.5">
                        Iniciar sesión
                    </button>
                </div>
            </form>
        </section>
    </main>

    <div id="app-modal"
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-[90%] shadow-2xl scale-95 transition-transform">
            <h3 id="modal-title" class="text-lg font-bold text-gray-900 mb-2">Aviso</h3>
            <p id="modal-body" class="text-gray-600 mb-6 text-sm leading-relaxed">Mensaje...</p>
            <div class="flex gap-3 justify-end">
                <button id="modal-close"
                    class="px-4 py-2 text-sm font-semibold text-gray-500 hover:bg-gray-100 rounded-lg transition-colors">Cerrar</button>
                <button id="modal-ok"
                    class="px-5 py-2 text-sm font-semibold bg-[#90d9d0] text-[#2c4744] rounded-lg hover:bg-[#7bc4bc] transition-colors">Aceptar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { firebaseConfig } from './assets/js/firebase-config.js';
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, connectAuthEmulator } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, connectFirestoreEmulator } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        // 🚀 INICIALIZACIÓN AUTÓNOMA
        const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('login-form');

        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                // 🎯 CONSERVAMOS TUS IDS NATIVOS ORIGINALES EXACTOS
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;

                const emailAlert = document.getElementById('login-email-alert');
                const passwordAlert = document.getElementById('login-password-alert');

                if (emailAlert) emailAlert.textContent = "";
                if (passwordAlert) passwordAlert.textContent = "";

                try {
                    console.log("🚀 Autenticando credenciales de operador...");
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    // 🛡️ Micro-espera síncrona para estabilización de tokens firmados
                    await new Promise(resolve => setTimeout(resolve, 250));

                    console.log("🔍 Extrayendo rol desde la colección unificada 'users' para UID:", user.uid);
                    const userDocRef = doc(db, 'users', user.uid);
                    const userDoc = await getDoc(userDocRef);

                    if (!userDoc.exists()) {
                        alert(`🚨 ERROR DE PERFIL:\n\nEl usuario existe, pero no tiene un documento en la colección "users".`);
                        if (passwordAlert) passwordAlert.textContent = "Error: Usuario no indexado.";
                        return;
                    }

                    const userData = userDoc.data();

                    // 🎯 REGLA DE ORO MIGRACIÓN: Mapeo dinámico híbrido (español e inglés)
                    const rawRole = userData.role || userData.rol || '';
                    const role = rawRole.toString().toLowerCase().trim();

                    const name = userData.nombre || userData.name || 'Operador Varius';

                    const rawTipo = userData.tipoMotorizado || userData.tipo || 'interno';
                    const tipoFinal = rawTipo.toString().toLowerCase().trim();

                    const status = (userData.status || userData.estado || 'Activo').toUpperCase().trim();

                    if (status === 'SUSPENDIDO') {
                        alert("🚫 Acceso Denegado: Esta cuenta se encuentra suspendida.");
                        if (passwordAlert) passwordAlert.textContent = "Cuenta Suspendida.";
                        return;
                    }

                    // 💾 PERSISTENCIA DE CONTROL EN EL NAVEGADOR
                    sessionStorage.setItem('user_role', role);
                    sessionStorage.setItem('motorizado_nombre', name);
                    sessionStorage.setItem('tipo_motorizado', tipoFinal);

                    console.log(`💾 Sesión Guardada -> Rol: [${role}] | Tipo: [${tipoFinal}]`);

                    // 🚀 REDIRECCIÓN CORREGIDA DIRECTA A LAS CARPETAS DE TU LIVE SERVER
                    if (role.includes('motorizado') || role === 'motorizado') {
                        console.log("🏍️ Abriendo Panel de Entregas Logísticas...");
                        window.location.replace('admin/motorizado.html');
                    } else if (role.includes('vendedor')) {
                        window.location.replace('admin/vendedor.html');
                    } else if (role.includes('admin') || role.includes('administrador')) {
                        console.log("💼 Abriendo Panel Central de Administrador...");
                        window.location.replace('admin/administrador.html');
                    } else {
                        window.location.replace('admin/motorizado.html');
                    }

                } catch (error) {
                    console.error("❌ Error en túnel de login:", error);

                    if (error.code === "permission-denied") {
                        console.warn("⚠️ Permiso denegado en local. Forzando ruta por persistencia.");
                        window.location.replace('admin/motorizado.html');
                    } else {
                        if (passwordAlert) passwordAlert.textContent = "Credenciales incorrectas.";
                    }
                }
            });
        }
    </script>
</body>

</html>
