<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Iniciar sesión | Varius Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="assets/img/favicon.png">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1976d2">

    <style>
        /* Animación del Fondo Mesh */
        @keyframes gradient-move {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .animated-bg {
            background: linear-gradient(-45deg, #f8fafc, #e2e8f0, #d1d5db, #90d9d0);
            background-size: 400% 400%;
            animation: gradient-move 15s ease infinite;
            position: relative;
            overflow: hidden;
        }

        /* Textura de puntitos (Dots) */
        .animated-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(#90d9d0 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            opacity: 0.2;
            pointer-events: none;
        }

        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
    <script>
        // Ejemplo en src/index.js o main.js
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("/service-worker.js")
                    .then(reg => console.log("ServiceWorker registrado:", reg.scope))
                    .catch(err => console.log("Error al registrar ServiceWorker:", err));
            });
        }
    </script>
</head>

<body class="animated-bg min-h-screen flex items-center justify-center p-4">
    <main class="w-full max-w-md">
        <section class="glass-card shadow-2xl rounded-2xl p-8 transition-all duration-300 hover:shadow-primary/20">
            <img src="admin/assets/img/logo.png" alt="Logo" class="block mx-auto mb-6 w-24 h-auto drop-shadow-sm" />

            <h1 class="text-2xl font-bold text-gray-800 text-center mb-8">¡Bienvenido de nuevo!</h1>

            <form id="login-form" class="space-y-5" novalidate>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1.5" for="login-email">Correo
                        electrónico</label>
                    <input id="login-email"
                        class="w-full h-11 px-4 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-[#90d9d0] focus:border-transparent transition-all"
                        type="email" placeholder="ejemplo@correo.com" required>
                    <div id="login-email-alert" class="text-xs text-red-500 mt-1 min-h-[1.25rem]"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1.5"
                        for="login-password">Contraseña</label>
                    <div class="relative">
                        <input id="login-password"
                            class="w-full h-11 px-4 rounded-xl border border-gray-200 outline-none focus:ring-2 focus:ring-[#90d9d0] focus:border-transparent transition-all"
                            type="password" placeholder="••••••••" required>
                        <button id="login-toggle-password" type="button"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
                            👁️
                        </button>
                    </div>
                    <div id="login-password-alert" class="text-xs text-red-500 mt-1 min-h-[1.25rem]"></div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="w-full bg-[#90d9d0] hover:bg-[#7bc4bc] text-[#2c4744] font-bold py-3 rounded-xl shadow-lg shadow-[#90d9d0]/30 transform transition-all active:scale-[0.98] hover:-translate-y-0.5">
                        Iniciar sesión
                    </button>
                </div>
            </form>
        </section>
    </main>

    <div id="app-modal"
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-[90%] shadow-2xl scale-95 transition-transform">
            <h3 id="modal-title" class="text-lg font-bold text-gray-900 mb-2">Aviso</h3>
            <p id="modal-body" class="text-gray-600 mb-6 text-sm leading-relaxed">Mensaje...</p>
            <div class="flex gap-3 justify-end">
                <button id="modal-close"
                    class="px-4 py-2 text-sm font-semibold text-gray-500 hover:bg-gray-100 rounded-lg transition-colors">Cerrar</button>
                <button id="modal-ok"
                    class="px-5 py-2 text-sm font-semibold bg-[#90d9d0] text-[#2c4744] rounded-lg hover:bg-[#7bc4bc] transition-colors">Aceptar</button>
            </div>
        </div>
    </div>

    <script type="module" src="assets/js/auth.js"></script>
    <script>
        // Script básico para mostrar/ocultar modal (puedes moverlo a auth.js)
        const modal = document.getElementById('app-modal');
        function toggleModal(show) {
            if (show) {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.children[0].classList.remove('scale-95');
            } else {
                modal.classList.add('opacity-0', 'pointer-events-none');
                modal.children[0].classList.add('scale-95');
            }
        }
    </script>
</body>

</html>
